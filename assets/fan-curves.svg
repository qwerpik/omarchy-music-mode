<circle cx="484.3" cy="44.0" r="4" class="f-cpu ring" stroke-width="2"/>
<text class="lab" x="305.8461538461538" y="200.16" text-anchor="middle">Case 33%</text>
<text class="lab" x="305.8461538461538" y="242.56" text-anchor="middle">CPU 28%</text>
<line x1="540" x2="558" y1="64" y2="64" class="s-cpu" stroke-width="2"/>
<circle cx="549" cy="64" r="4" class="f-cpu ring" stroke-width="2"/>
<text x="566" y="68" class="ink">CPU fan</text>
<line x1="540" x2="558" y1="86" y2="86" class="s-case" stroke-width="2"/>
<circle cx="549" cy="86" r="4" class="f-case ring" stroke-width="2"/>
<text x="566" y="90" class="ink">Case fan</text>
